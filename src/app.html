<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

		<!-- SEO 基础 Meta -->
		<meta name="description" content="XVideos 影视聚合系统 - 在线观看最新电影、电视剧、动漫、综艺、短视频" />
		<meta name="keywords" content="影视,电影,电视剧,动漫,综艺,短视频,在线观看" />
		<meta name="author" content="XVideos" />
		<meta name="theme-color" content="#FB7299" />

		<!-- Open Graph Meta Tags -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="XVideos 影视" />
		<meta property="og:title" content="XVideos 影视聚合系统" />
		<meta property="og:description" content="在线观看最新电影、电视剧、动漫、综艺、短视频" />
		<meta property="og:image" content="%sveltekit.assets%/icons/icon-512.png" />
		<meta property="og:locale" content="zh_CN" />

		<!-- Twitter Card Meta Tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="XVideos 影视聚合系统" />
		<meta name="twitter:description" content="在线观看最新电影、电视剧、动漫、综艺、短视频" />
		<meta name="twitter:image" content="%sveltekit.assets%/icons/icon-512.png" />
		<meta name="twitter:site" content="@xvideos" />
		<meta name="twitter:creator" content="@xvideos" />
		<meta name="twitter:player:width" content="480" />
		<meta name="twitter:player:height" content="270" />
		<meta name="twitter:app:name:iphone" content="XVideos 影视" />
		<meta name="twitter:app:name:googleplay" content="XVideos 影视" />
		<meta name="twitter:app:url:googleplay" content="https://t.me/xvideos_bot/app" />
		<meta name="twitter:app:url:iphone" content="https://t.me/xvideos_bot/app" />

		<!-- 结构化数据 JSON-LD（默认网站信息） -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebSite",
			"name": "XVideos 影视",
			"url": "https://xvideos.com",
			"description": "XVideos 影视聚合系统 - 在线观看最新电影、电视剧、动漫、综艺、短视频",
			"potentialAction": {
				"@type": "SearchAction",
				"target": "https://xvideos.com/search?keyword={search_term_string}",
				"query-input": "required name=search_term_string"
			}
		}
		</script>

		<!-- 结构化数据 JSON-LD（Article Schema - 用于标签页） -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebPage",
			"@id": "https://xvideos.com",
			"name": "XVideos 影视聚合系统",
			"description": "在线观看最新电影、电视剧、动漫、综艺、短视频",
			"publisher": {
				"@type": "Organization",
				"name": "XVideos 影视",
				"logo": {
					"@type": "ImageObject",
					"url": "https://xvideos.com/icons/icon-512.png"
				}
			},
			"inLanguage": "zh-CN"
		}
		</script>

		<!-- 结构化数据 JSON-LD（BreadcrumbList Schema - 面包屑导航） -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "BreadcrumbList",
			"itemListElement": [
				{
					"@type": "ListItem",
					"position": 1,
					"name": "首页",
					"item": "https://xvideos.com"
				}
			]
		}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
