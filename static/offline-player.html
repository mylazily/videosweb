<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>离线播放器 - XVideos 影视</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: #17181A;
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 20px;
		}
		.container {
			text-align: center;
			max-width: 400px;
		}
		.icon {
			width: 80px;
			height: 80px;
			margin: 0 auto 20px;
			background: rgba(251, 114, 153, 0.1);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.icon svg {
			width: 40px;
			height: 40px;
			fill: #FB7299;
		}
		h1 {
			font-size: 20px;
			margin-bottom: 10px;
			color: #fff;
		}
		p {
			font-size: 14px;
			color: #999;
			line-height: 1.6;
			margin-bottom: 24px;
		}
		.btn {
			display: inline-block;
			padding: 12px 32px;
			background: #FB7299;
			color: #fff;
			border: none;
			border-radius: 24px;
			font-size: 14px;
			cursor: pointer;
			text-decoration: none;
			transition: opacity 0.2s;
		}
		.btn:hover { opacity: 0.9; }
		.btn-secondary {
			display: inline-block;
			padding: 10px 24px;
			background: transparent;
			color: #FB7299;
			border: 1px solid #FB7299;
			border-radius: 24px;
			font-size: 13px;
			cursor: pointer;
			text-decoration: none;
			margin-top: 12px;
			transition: opacity 0.2s;
		}
		.btn-secondary:hover { opacity: 0.9; }
	</style>
</head>
<body>
	<div class="container">
		<div class="icon">
			<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
		</div>
		<h1>当前处于离线状态</h1>
		<p>无法连接到服务器，请检查网络连接后重试</p>
		<a href="javascript:void(0)" class="btn" onclick="window.location.reload()">重新连接</a>
		<br>
		<a href="/" class="btn-secondary">返回首页</a>
	</div>
	<script>
		window.addEventListener('online', () => {
			window.location.reload();
		});
	</script>
</body>
</html>
