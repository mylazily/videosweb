<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>XVideos 影视 - 离线模式</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: #17181A;
			color: #E6E6E6;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.offline-icon {
			width: 80px;
			height: 80px;
			border-radius: 50%;
			background: #222325;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 20px;
			font-size: 36px;
		}
		h1 {
			font-size: 20px;
			margin-bottom: 8px;
			color: #FB7299;
		}
		p {
			color: #999;
			font-size: 14px;
			text-align: center;
			line-height: 1.6;
		}
		.skeleton {
			margin-top: 40px;
			width: 100%;
			max-width: 400px;
		}
		.skeleton-card {
			background: #222325;
			border-radius: 8px;
			margin-bottom: 12px;
			overflow: hidden;
		}
		.skeleton-img {
			width: 100%;
			height: 200px;
			background: linear-gradient(90deg, #222325 25%, #2E2F31 50%, #222325 75%);
			background-size: 200% 100%;
			animation: shimmer 1.5s infinite;
		}
		.skeleton-text {
			height: 14px;
			background: linear-gradient(90deg, #222325 25%, #2E2F31 50%, #222325 75%);
			background-size: 200% 100%;
			animation: shimmer 1.5s infinite;
			margin: 12px;
			border-radius: 4px;
		}
		.skeleton-text.short { width: 60%; }
		.skeleton-text.medium { width: 80%; }
		@keyframes shimmer {
			0% { background-position: -200% 0; }
			100% { background-position: 200% 0; }
		}
		.retry-btn {
			margin-top: 24px;
			padding: 10px 32px;
			background: #FB7299;
			color: white;
			border: none;
			border-radius: 20px;
			font-size: 14px;
			cursor: pointer;
		}
		.retry-btn:active {
			background: #E45580;
		}
	</style>
</head>
<body>
	<div class="offline-icon">&#128268;</div>
	<h1>网络连接已断开</h1>
	<p>请检查网络连接后重试<br />已缓存的内容仍可查看</p>
	<button class="retry-btn" onclick="location.reload()">重新连接</button>

	<div class="skeleton">
		<div class="skeleton-card">
			<div class="skeleton-img"></div>
			<div class="skeleton-text medium"></div>
			<div class="skeleton-text short"></div>
		</div>
		<div class="skeleton-card">
			<div class="skeleton-img"></div>
			<div class="skeleton-text medium"></div>
			<div class="skeleton-text short"></div>
		</div>
	</div>
</body>
</html>
