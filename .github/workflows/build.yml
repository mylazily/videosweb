# =============================================================================
# 大周转架构 - 每12小时自动构建部署
# 策略: Svelte 5 SSG + Cloudflare Pages + Go 后端数据供给
# 北京时间 03:00 / 15:00（UTC 19:00 / 07:00）
# =============================================================================

name: 12H Build & Deploy

on:
  schedule:
    # 每12小时触发（UTC 19:00 = 北京 03:00，UTC 07:00 = 北京 15:00）
    - cron: '0 19,7 * * *'
  workflow_dispatch:
    # 支持手动触发
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动构建'

# 权限控制
permissions:
  contents: read

# 并发控制 - 确保同一时间只有一个构建运行
concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # -------------------------------------------------------------------------
      # 1. 检出代码
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速

      # -------------------------------------------------------------------------
      # 2. 设置 Node.js 环境
      # -------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -------------------------------------------------------------------------
      # 3. 安装依赖
      # -------------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # -------------------------------------------------------------------------
      # 4. 从 Go 后端拉取最新数据（12小时冰封缓存数据源）
      # -------------------------------------------------------------------------
      - name: Fetch Data from Go Backend
        env:
          API_BASE: ${{ secrets.API_BASE_URL }}
        run: |
          echo "🔄 拉取最新视频数据..."
          mkdir -p static/data

          # 首页热门数据（预渲染用 - 12条）
          curl -sf --max-time 30 \
            "${API_BASE:-https://9901.555554.xyz}/api/v1/videos/hot?page=1&page_size=12" \
            -o static/data/hot.json || echo '{"data":{"list":[]}}' > static/data/hot.json

          # 最新数据（预渲染用 - 12条）
          curl -sf --max-time 30 \
            "${API_BASE:-https://9901.555554.xyz}/api/v1/videos/latest?page=1&page_size=12" \
            -o static/data/latest.json || echo '{"data":{"list":[]}}' > static/data/latest.json

          # 分类数据（导航用）
          curl -sf --max-time 15 \
            "${API_BASE:-https://9901.555554.xyz}/api/v1/categories" \
            -o static/data/categories.json || echo '{"data":[]}' > static/data/categories.json

          # 热门搜索词
          curl -sf --max-time 15 \
            "${API_BASE:-https://9901.555554.xyz}/api/v1/search/hot" \
            -o static/data/hot-search.json || echo '{"data":[]}' > static/data/hot-search.json

          echo "✅ 数据拉取完成"
          ls -la static/data/

      # -------------------------------------------------------------------------
      # 5. Svelte 5 构建（纯静态导出）
      # -------------------------------------------------------------------------
      - name: Build SvelteKit Static
        run: |
          echo "🔨 开始 Svelte 5 静态构建..."
          npm run build
          echo "✅ 构建完成"
          
          # 输出构建产物大小
          echo "📦 产物统计:"
          du -sh build/ 2>/dev/null || du -sh .svelte-kit/output/

      # -------------------------------------------------------------------------
      # 6. 部署到 Cloudflare Pages
      # -------------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=shipinku --branch=main

      # -------------------------------------------------------------------------
      # 7. 构建报告
      # -------------------------------------------------------------------------
      - name: Build Summary
        run: |
          echo "## ✅ 12H 冰封缓存构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **构建时间** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **触发方式** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **架构** | Svelte 5 + adapter-static |" >> $GITHUB_STEP_SUMMARY
          echo "| **缓存策略** | HTML 12小时死缓存 / 图片永久缓存 |" >> $GITHUB_STEP_SUMMARY
          echo "| **预渲染** | 首页数据直出（首屏 0ms 等待） |" >> $GITHUB_STEP_SUMMARY
          echo "| **部署目标** | Cloudflare Pages 边缘节点 |" >> $GITHUB_STEP_SUMMARY
          echo "| **下次构建** | 12小时后 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [访问站点](https://shipinku.pages.dev)" >> $GITHUB_STEP_SUMMARY
